<div class="checkout-container">

<h2>Checkout</h2>

<form [formGroup]="orderForm" (ngSubmit)="placeOrder()">

<label>Name</label>
<input type="text" formControlName="name">

<label>Phone</label>
<input type="text" formControlName="phone">

<label>Address</label>
<textarea formControlName="address"></textarea>

<label>Payment Method</label>
<select formControlName="payment">
<option value="cash">Cash on Delivery</option>
<option value="card">Card</option>
</select>

<button (click)="placeOrder()" class="order-btn">
Place Order
</button>

</form>

<h3>Order Summary</h3>

<div *ngFor="let item of cartService.getItems()">
{{item.name}} - ₹{{item.price}}
</div>


<h3>Total: ₹{{cartService.getTotal()}}</h3>

</div>

<div class="checkout-container">
  <h2>Checkout</h2>

  <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Name</label>
      <input type="text" formControlName="name" />
      <small *ngIf="orderForm.get('name')?.touched && orderForm.get('name')?.invalid">
        Name is required
      </small>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" />
      <small *ngIf="orderForm.get('email')?.touched && orderForm.get('email')?.invalid">
        Enter a valid email
      </small>
    </div>

    <div class="form-group">
      <label>Address</label>
      <textarea formControlName="address"></textarea>
      <small *ngIf="orderForm.get('address')?.touched && orderForm.get('address')?.invalid">
        Address is required
      </small>
    </div>

    <button type="submit" [disabled]="orderForm.invalid">
      Place Order
    </button>

  </form>
</div>

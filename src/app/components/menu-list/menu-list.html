<div class="menu-container">
 <div class="category-filter">



</div>
  <!-- Price Filter -->
  <div class="filter">

    <label>Max Price: ₹{{maxPrice}}</label>

    <input
      type="range"
      min="0"
      max="300"
      [(ngModel)]="maxPrice">

  </div>


  <div class="menu-items">

    <mat-card
      class="menu-card"
      *ngFor="let item of menuItems | priceFilter:maxPrice">

      <img
        mat-card-image
        [src]="item.image"
        alt="{{item.name}}">

      <mat-card-title>
        {{item.name}}
      </mat-card-title>

      <mat-card-content>

        <p>{{item.price | currency:'INR'}}</p>

      </mat-card-content>


      <!-- Add to Cart -->
      <button
        mat-raised-button
        color="primary"
        (click)="addToCart(item)">

        Add to Cart

      </button>


      <!-- Quantity Controls -->
      <div class="quantity-controls">

        <button
          mat-icon-button
          color="accent"
          (click)="decreaseQuantity(item)">

          <mat-icon>remove</mat-icon>

        </button>

        <span class="qty">

          {{ getQuantity(item) }}

        </span>

        <button
          mat-icon-button
          color="accent"
          (click)="increaseQuantity(item)">

          <mat-icon>add</mat-icon>

        </button>

      </div>

    </mat-card>

  </div>

</div>
